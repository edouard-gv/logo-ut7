<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Générateur paramétrique de logo UT7 au format SVG" />
    <title>UT7 — Générateur SVG</title>
  </head>
  <body>
    <main class="app">
      <section class="intro">
        <p class="eyebrow">Générateur paramétrique</p>
        <h1>Composer <span>/ut7</span></h1>
        <p class="lede">Décrivez la construction, ajustez sa géométrie et récupérez un SVG propre, prêt à l’emploi.</p>
      </section>

      <section class="workspace">
        <form id="controls" class="panel controls" novalidate>
          <label class="notation-field">
            <span>Notation</span>
            <input id="notation" value="m1/,e-1,c1,1,c1,m1,12,e-0.4,m0/" spellcheck="false" autocomplete="off" />
            <small id="notation-help">Séparateur , · / incline · e1 ou e+1 ajoute · e-1 retire</small>
          </label>

          <fieldset>
            <legend>Espacement des niveaux</legend>
            <div class="control-grid three">
              <label><span>0 → 1 <output data-value-for="gap01">1</output></span><input id="gap01" type="range" value="1" min="0.05" max="3" step="0.05" /></label>
              <label><span>1 → 2 <output data-value-for="gap12">1.3</output></span><input id="gap12" type="range" value="1.3" min="0.05" max="3" step="0.05" /></label>
              <label><span>2 → 3 <output data-value-for="gap23">1</output></span><input id="gap23" type="range" value="1" min="0.05" max="3" step="0.05" /></label>
            </div>
          </fieldset>

          <fieldset>
            <legend>Géométrie</legend>
            <div class="control-grid">
              <label><span>Entre les barres <output data-value-for="barGap">0.5</output></span><input id="barGap" type="range" value="0.5" min="0" max="3" step="0.05" /></label>
              <label><span>Inclinaison <output data-value-for="angle">−20°</output></span><input id="angle" type="range" value="-20" min="-80" max="80" step="1" /></label>
              <label><span>Épaisseur des barres <output data-value-for="barWidth">0.4</output></span><input id="barWidth" type="range" value="0.4" min="0.01" max="1" step="0.01" /></label>
              <label><span>Épaisseur des liens <output data-value-for="linkWidth">0.1</output></span><input id="linkWidth" type="range" value="0.1" min="0.01" max="0.5" step="0.01" /></label>
              <label class="check-field"><input id="horizontalTops" type="checkbox" /><span>Haut des barres horizontal</span></label>
              <label class="check-field"><input id="horizontalBottoms" type="checkbox" /><span>Bas des barres horizontal</span></label>
              <label class="check-field"><input id="inscribedTrapezoid" type="checkbox" /><span>Inscrire dans un trapèze</span></label>
              <label class="check-field"><input id="transparentBackground" type="checkbox" /><span>Fond transparent</span></label>
              <label class="check-field"><input id="transparentShapes" type="checkbox" /><span>Barres et liens transparents</span></label>
              <label><span>Arrondis <output data-value-for="roundedCorners">0</output></span><input id="roundedCorners" type="range" value="0.15" min="0" max="0.5" step="0.01" /></label>
            </div>
          </fieldset>

          <fieldset>
            <legend>Affichage</legend>
            <label class="range-field">
              <span>Échelle <output id="scale-output">1×</output></span>
              <input id="scale" type="range" value="1" min="0.5" max="2" step="0.05" />
            </label>
          </fieldset>
        </form>

        <section class="panel preview-panel">
          <div class="preview-heading">
            <div><p>Aperçu</p><span>200 × 200 px</span></div>
            <div class="preview-actions">
              <button id="save-config" type="button">Sauver la configuration</button>
              <button id="download" type="button">Télécharger SVG</button>
            </div>
          </div>
          <div id="preview" class="preview" aria-live="polite"></div>
          <p id="error" class="error" role="alert"></p>
        </section>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
